# One-time housekeeping only: prune eight feature branches after verified PR merges.
# Only triggered when this file is initially added to main.
name: Remove merged feature branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified merged heads (preserve main)
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const targets=[
              ['design/election-night-2026',1],
              ['design/capitol-election-broadcast',2],
              ['fix/candidate-filter-layout-2026',3],
              ['design/patriotic-flag-wallpaper',4],
              ['design/editorial-finish-2026',5],
              ['fix/map-state-selector-polish',6],
              ['design/authentic-us-flag-capitol-header',7],
              ['fix/presentation-audit-2026-10-12',8]
            ];
            const {data: branches}=await github.rest.repos.listBranches({owner,repo,per_page:100});
            const existing=new Set(branches.map(b=>b.name));
            for (const [branch,prNumber] of targets) {
              if (branch==='main') throw new Error('Cannot delete default branch');
              const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:prNumber});
              if (!pr.merged || pr.base.ref!=='main' || pr.head.ref!==branch) {
                throw new Error(`Safety check failed for PR #${prNumber}, branch ${branch}`);
              }
              if (!existing.has(branch)) {
                core.info(`Already absent: ${branch}`);
                continue;
              }
              await github.rest.git.deleteRef({owner,repo,ref:`heads/${branch}`});
              core.info(`Deleted merged branch ${branch} (PR #${prNumber})`);
            }
