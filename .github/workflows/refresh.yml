name: Refresh Congress odds
on:
  schedule:
    # 5-minute trigger grid; lightweight cadence job skips slots outside
    # the election-week policy. Times are best-effort with GitHub Actions.
    - cron: '2-59/5 * * * *'
    # Redundant hourly fallback: this schedule worked before the 5-minute
    # upgrade and helps if GitHub skips the high-frequency trigger.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: congress-odds-refresh
  cancel-in-progress: false
jobs:
  cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.policy.outputs.run }}
      candidates: ${{ steps.policy.outputs.candidates }}
      model: ${{ steps.policy.outputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Decide whether a full refresh is due
        id: policy
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/refresh-cadence.mjs
  refresh:
    needs: cadence
    if: needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install model dependencies
        id: dependencies
        continue-on-error: true
        run: pip install -r scripts/requirements.txt
      - name: Validate parsers, recovery logic and saved snapshots
        run: |
          node --test scripts/*.test.mjs
          node scripts/validate-build.mjs
      - name: Validate model chronology
        if: steps.dependencies.outcome == 'success'
        run: python scripts/test_model.py
      - name: Retrieve verified source data
        id: markets
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Report market refresh failure
        if: steps.markets.outcome == 'failure'
        run: echo "::warning::Market retrieval failed. Publishing the validated previous snapshots with original timestamps; stale quotes are excluded on the site."
      - name: Refresh candidate names, photos and race odds
        if: needs.cadence.outputs.candidates == 'true'
        id: candidates
        continue-on-error: true
        run: node scripts/update-candidates.mjs
      - name: Report candidate refresh failure
        if: steps.candidates.outcome == 'failure'
        run: echo "::warning::Candidate refresh failed. Retaining previous profiles with their original retrieval timestamps."
      - name: Record real candidate quote history
        if: steps.candidates.outcome == 'success'
        run: node scripts/update-race-history.mjs
      - name: Train daily model
        if: steps.dependencies.outcome == 'success' && needs.cadence.outputs.model == 'true'
        timeout-minutes: 10
        id: model
        continue-on-error: true
        run: python scripts/train-model.py
      - name: Report training failure
        if: steps.model.outcome == 'failure' || steps.dependencies.outcome == 'failure'
        run: echo "::warning::Model training failed. Retaining timestamped previous forecasts; expired forecasts are labeled on the site."
      - name: Update README comparisons and model results
        run: node scripts/update-readme.mjs
      - name: Validate generated snapshots before publication
        run: node scripts/validate-build.mjs
      - name: Save snapshots and README
        id: save
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::Newer code is on the default branch. Skipping this older publication; the next refresh uses the latest code."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add dist/data/*.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Congress control probabilities'
            if ! git push origin "HEAD:$DEFAULT_BRANCH"; then
              git fetch origin "$DEFAULT_BRANCH" --depth=1
              if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
                echo "::notice::The branch advanced during refresh. Skipping this older deployment."
                echo 'publish=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo '::error::Could not save refreshed data.'
              exit 1
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Package current source download
        if: steps.save.outputs.publish == 'true'
        run: python scripts/package-source.py
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.publish == 'true'
        with:
          path: dist
  deploy:
    needs: refresh
    if: needs.refresh.outputs.publish == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
