name: Refresh Congress odds
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: congress-odds-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve verified source data and update README
        run: node scripts/update-data.mjs
      - name: Save snapshot and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/latest.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Congress control probabilities'
            git push
          fi
      - name: Package current source download
        run: python scripts/package-source.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
