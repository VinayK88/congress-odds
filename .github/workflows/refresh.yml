name: Refresh Congress odds
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: congress-odds-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install model dependencies
        run: pip install -r scripts/requirements.txt
      - name: Validate parsers and model chronology
        run: |
          node --test scripts/data-core.test.mjs
          python scripts/test_model.py
      - name: Retrieve verified source data
        run: node scripts/update-data.mjs
      - name: Train daily model
        id: model
        continue-on-error: true
        run: python scripts/train-model.py
      - name: Report training failure
        if: steps.model.outcome == 'failure'
        run: echo "::warning::Model training failed. Retaining timestamped previous forecasts; expired forecasts are labeled on the site."
      - name: Update README comparisons and model results
        run: node scripts/update-readme.mjs
      - name: Save snapshots and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/*.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Congress control probabilities'
            git push
          fi
      - name: Package current source download
        run: python scripts/package-source.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
